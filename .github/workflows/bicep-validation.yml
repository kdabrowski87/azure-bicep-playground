name: Bicep Validation

on:
  pull_request:
    paths:
      - 'infra/**/*.bicep'
      - 'infra/**/*.bicepparam'
      - '.github/workflows/bicep-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**/*.bicep'
      - 'infra/**/*.bicepparam'
      - '.github/workflows/bicep-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint and validate Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o bicep "https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64"
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep

      - name: Show Bicep version
        run: bicep --version

      - name: Lint and validate files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          run_bicep_mode() {
            local mode="$1"
            local empty_message="$2"
            shift 2
            local files=("$@")

            if [ ${#files[@]} -eq 0 ]; then
              echo "${empty_message}"
              return 0
            fi

            for file in "${files[@]}"; do
              case "${mode}" in
                lint)
                  echo "Linting ${file}"
                  bicep lint "${file}"
                  ;;
                build)
                  echo "Validating ${file}"
                  bicep build "${file}" --stdout
                  ;;
                build-params)
                  echo "Validating ${file}"
                  bicep build-params "${file}" --stdout
                  ;;
                *)
                  echo "Unsupported mode: ${mode}"
                  return 1
                  ;;
              esac
            done
          }

          bicep_files=(infra/**/*.bicep)
          bicepparam_files=(infra/**/*.bicepparam)

          run_bicep_mode lint 'No .bicep files found under infra/.' "${bicep_files[@]}"
          run_bicep_mode build 'No .bicep files found under infra/.' "${bicep_files[@]}"
          run_bicep_mode build-params 'No .bicepparam files found under infra/.' "${bicepparam_files[@]}"
